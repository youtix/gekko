# Never write your keys in this file, which git tracks: copy it to config/realtime-sandbox-trader.local.yml (git ignores every
# config/*.local.* file), fill in your testnet API key, secret and bot token there and point GEKKO_CONFIG_FILE_PATH at the copy. Gekko
# takes every value as written: it reads no environment variable inside the file (apiKey: ${API_KEY} is the text ${API_KEY}).

watch:
  assets:
    - BTC
  currency: USDT
  timeframe: 5m
  mode: realtime # backtest | importer | realtime
  warmup:
    candleCount: 365

exchange:
  name: binance
  sandbox: true
  apiKey: # Your key
  secret: # Your secret

strategy:
  name: DEMA
  period: 12
  thresholds:
    up: 100
    down: -150

plugins:
  - name: 'TradingAdvisor'
    strategyName: 'DEMA'

  - name: 'Trader'

  - name: 'RoundTripAnalyzer'
    enableConsoleTable: true

  - name: EventSubscriber
    token: # Your telegram bot token
    botUsername: # Your telegram bot username
    # chatId: 123456789 # Optional: the chat the bot talks to; without it, the first chat that sends it a command after start-up is bound
