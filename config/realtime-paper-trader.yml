# Never write your bot token in this file, which git tracks: copy it to config/realtime-paper-trader.local.yml (git ignores every
# config/*.local.* file), fill in the token there and point GEKKO_CONFIG_FILE_PATH at the copy. Gekko takes every value as written: it
# reads no environment variable inside the file (token: ${BOT_TOKEN} is the text ${BOT_TOKEN}).

watch:
  assets:
    - BTC
  currency: USDT
  timeframe: 5m
  mode: realtime # backtest | importer | realtime
  warmup:
    candleCount: 365

exchange:
  name: paper-binance
  simulationBalance:
    - assetName: BTC
      balance: 100
    - assetName: USDT
      balance: 300000

strategy:
  name: DEMA
  period: 12
  thresholds:
    up: 100
    down: -150

plugins:
  - name: 'TradingAdvisor'
    strategyName: 'DEMA'

  - name: 'Trader'

  - name: 'RoundTripAnalyzer'
    enableConsoleTable: true

  - name: EventSubscriber
    token: # Your telegram bot token
    botUsername: # Your telegram bot username
    # chatId: 123456789 # Optional: the chat the bot talks to; without it, the first chat that sends it a command after start-up is bound
