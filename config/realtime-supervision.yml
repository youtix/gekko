# Never write your bot token in this file, which git tracks: copy it to config/realtime-supervision.local.yml (git ignores every
# config/*.local.* file), fill in the token there and point GEKKO_CONFIG_FILE_PATH at the copy. Gekko takes every value as written: it
# reads no environment variable inside the file (token: ${BOT_TOKEN} is the text ${BOT_TOKEN}).

watch:
  assets:
    - BTC
  currency: USDT
  timeframe: 5m
  mode: realtime

exchange:
  name: paper-binance
  simulationBalance:
    - assetName: BTC
      balance: 100
    - assetName: USDT
      balance: 300000

strategy:
  name: DebugAdvice
  each: 2 # one advice every 2 candles: a SELL, then a BUY, and so on
  wait: 0 # candles to let go by before the first advice

plugins:
  - name: TradingAdvisor
    strategyName: DebugAdvice

  - name: Trader

  - name: Supervision
    token: # Your telegram bot token
    botUsername: # Your telegram bot username
    # chatId: 123456789 # Optional: the chat the bot talks to; without it, the first chat that sends it a command after start-up is bound
    cpuThreshold: 80
    memoryThreshold: 1024
    cpuCheckInterval: 10000
    memoryCheckInterval: 10000
